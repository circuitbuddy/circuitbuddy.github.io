<!-- ============ NAV ============ -->
<header class="sticky top-0 z-50 bg-[#255f5d] backdrop-blur border-b-4 border-yellow-400">
  <nav class="relative max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
    <a routerLink="/" class="flex items-center gap-2" aria-label="Circuit Buddy home">
      <img src="/assets/circuit-buddy-web-logo.png" alt="Circuit Buddy logo" class="h-10" />
    </a>

    <!-- Language switch (centered) -->
    <div
      class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-row justify-center"
    >
      @if (i18n.lang() !== 'en') {
        <button
          type="button"
          class="flex flex-row items-center justify-center text-sm md:text-base font-semibold text-gray-200 px-2.5 md:px-3 py-1 rounded-full bg-teal-700 hover:bg-[#236a64] border border-teal-400 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-400"
          [attr.aria-label]="'nav.switchToEnglish' | t"
          (click)="i18n.setLang('en')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            fill="#ebe6e7"
            class="inline-block w-4 md:w-5 mr-1.5 md:mr-2"
            aria-hidden="true"
          >
            <path
              d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480.5-880t155 31.5q72.5 31.5 127 86t86 127Q880-563 880-480.5T848.5-325q-31.5 73-86 127.5t-127 86Q563-80 480.5-80T325-111.5ZM480-162q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z"
            />
          </svg>
          English
        </button>
      }
      @if (i18n.lang() !== 'si') {
        <button
          type="button"
          class="flex flex-row items-center justify-center text-sm md:text-base font-semibold text-gray-200 px-2.5 md:px-3 py-1 rounded-full bg-teal-700 hover:bg-[#236a64] border border-teal-400 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-400"
          [attr.aria-label]="'nav.switchToSinhala' | t"
          (click)="i18n.setLang('si')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            fill="#ebe6e7"
            class="inline-block w-4 md:w-5 mr-1.5 md:mr-2"
            aria-hidden="true"
          >
            <path
              d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480.5-880t155 31.5q72.5 31.5 127 86t86 127Q880-563 880-480.5T848.5-325q-31.5 73-86 127.5t-127 86Q563-80 480.5-80T325-111.5ZM480-162q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z"
            />
          </svg>
          සිංහල
        </button>
      }
    </div>

    <!-- Mobile menu button -->
    <button
      id="menuBtn"
      type="button"
      class="md:hidden p-2 rounded-lg text-yellow-400 focus:outline-none focus:ring-2 focus:ring-yellow-400"
      [attr.aria-label]="(isMobileMenuOpen ? 'nav.closeMenu' : 'nav.openMenu') | t"
      [attr.aria-expanded]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
    >
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <!-- Desktop links -->
    <ul class="hidden md:flex items-center gap-6 font-bold">
      <li>
        <a
          href="#"
          appScrollTo="about"
          class="text-white hover:text-yellow-400 transition-colors"
          >{{ 'nav.about' | t }}</a
        >
      </li>
      <li>
        <a
          href="#"
          appScrollTo="circuits"
          class="text-white hover:text-yellow-400 transition-colors"
          >{{ 'nav.circuits' | t }}</a
        >
      </li>
      <li>
        <a
          href="#"
          appScrollTo="contact"
          class="text-white hover:text-yellow-400 transition-colors"
          >{{ 'nav.contact' | t }}</a
        >
      </li>
      <!-- <li>
        <a
          href="#"
          appScrollTo="circuits"
          class="bg-yellow-400 text-teal-deep px-4 py-2 rounded-full font-display font-bold hover:bg-buddy-amber transition-colors"
        >
          {{ 'nav.shop' | t }}
        </a>
      </li> -->
    </ul>
  </nav>

  <!-- Mobile dropdown -->
  <ul
    id="mobileMenu"
    class="md:hidden flex-col bg-[#375f5d] border-t border-teal-trace/40 px-4 pb-4 font-bold text-lg"
    [class.hidden]="!isMobileMenuOpen"
  >
    <li>
      <a
        href="#"
        appScrollTo="about"
        class="block py-3 border-b text-gray-200 border-teal-trace/30"
        (click)="closeMobileMenu()"
        >{{ 'nav.about' | t }}</a
      >
    </li>
    <li>
      <a
        href="#"
        appScrollTo="circuits"
        class="block py-3 border-b text-gray-200 border-teal-trace/30"
        (click)="closeMobileMenu()"
        >{{ 'nav.circuits' | t }}</a
      >
    </li>
    <li>
      <a
        href="#"
        appScrollTo="contact"
        class="block py-3 text-gray-200"
        (click)="closeMobileMenu()"
        >{{ 'nav.contact' | t }}</a
      >
    </li>
  </ul>
</header>
